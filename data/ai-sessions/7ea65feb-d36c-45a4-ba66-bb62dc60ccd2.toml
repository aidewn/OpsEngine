  content = "数据充分了，下面给出完整分析：\n\n---\n\n## 📊 完整运行状态报告\n\n### 🟢 健康：CPU / 内存 / 网络\n\n| 指标 | 数值 | 评价 |\n|------|------|------|\n| CPU 负载 | 0.27 / 0.22 / 0.27（16核） | 几乎空闲 |\n| 内存 | 3.1Gi / 26Gi，可用 23Gi | 非常充裕 |\n| 主网卡 | ens33 UP，192.168.112.128/24 | 正常 |\n\n---\n\n### 🔴 风险：磁盘空间\n\n```\n/dev/sda2  20G → 16G 已用 (83%) → 仅剩 3.4G\n```\n\n**同一块 20G 根分区承载了：**\n\n| 消费者 | 路径 |\n|--------|------|\n| Docker 镜像/容器/卷 | `/var/lib/docker/` |\n| MicroK8s（snap）+ 全部 K8s 资源 | `/var/snap/microk8s/` |\n| 30+ 个 snap 包 | `/snap/`（code、firefox、kubectl…） |\n| Docker overlay rootfs | `/var/lib/docker/rootfs/overlayfs/` |\n| MicroK8s containerd rootfs | `/var/snap/microk8s/common/run/containerd/...` |\n\n**Docker + MicroK8s 双重容器运行时叠加是磁盘消耗的主要原因。**\n\n---\n\n### 🟡 发现：同时运行 Docker 和 MicroK8s\n\n- **Docker**：`/var/lib/docker/` 下有 containers、volumes、overlayfs\n- **MicroK8s**（snap 安装，版本 8612）：自带 containerd，Calico CNI\n- 两者都创建了大量 overlay 挂载，共享根分区\n\n---\n\n### 🟡 安全注意：服务暴露\n\n| 端口 | 服务 | 绑定 | 风险 |\n|------|------|------|------|\n| **3306** | MySQL | `0.0.0.0` | ⚠️ 全网可访问 |\n| **6379** | Redis | `0.0.0.0` | ⚠️ 全网可访问 |\n| **80** | HTTP | `0.0.0.0` | 注意 |\n| 22 | SSH | `0.0.0.0` | 正常 |\n\n---\n\n### 📋 建议优先级\n\n1. **🔴 立即清理磁盘**（否则随时可能写满）：\n   ```bash\n   docker system prune -a    # 清理未使用的 Docker 镜像/容器/卷\n   microk8s ctr images prune --all   # 清理未使用的 containerd 镜像\n   snap list                 # 检查旧版本 snap，可 purge 旧版本\n   ```\n   同时卸载两个已无用的 CD-ROM 挂载：\n   ```bash\n   umount /run/media/lgx/CDROM\n   umount \"/run/media/lgx/Ubuntu 26.04 amd64\"\n   ```\n\n2. **🟡 限制 MySQL/Redis 监听范围**：如果只需本地访问，改为绑定 `127.0.0.1`\n\n3. **🟡 考虑扩容或迁移**：20G 根分区对「Docker + MicroK8s + 桌面 snap」组合偏小，建议至少扩至 40G 或将 Docker/K8s 数据目录迁移到独立磁盘。\n\n需要我帮你执行任何清理操作或进一步排查某个具体服务吗？"
