  content = "---\n\n## 环境运行状态诊断\n\n### 🔴 首要问题：间歇性 CPU 飙高 (~414%)\n\n`snap`、`pro`、`ubuntu-insights` 等进程周期性出现，每次消耗 400%+ CPU 后迅速消失。它们都源自 `systemd --user` (root)，伴随 syslog 中 `ubuntu-insights-upload.service` 的完成记录。这是 **Ubuntu 26.04 引入的 insights 遥测框架**在后台收集系统报告，因 bug 或配置问题反复触发导致 CPU 暴增。\n\n### 🟡 次要风险：磁盘空间紧张 (84%)\n\nroot 分区 20G 仅剩 3.1G。microk8s（containerd 的多层 overlay 挂载）和 Docker（2 个 overlayfs 容器）叠加占用，空间将持续萎缩。\n\n### 🟢 正常项\n\n- 内存充裕（26G 仅用 3.2G）\n- 系统负载低（0.20/0.46/0.32）\n- SSH 无异常登录痕迹（均来自内网 192.168.112.1）\n- 未发现 crontab 后门或恶意 systemd 服务\n\n---\n\n**建议立即执行：**\n\n| 优先级 | 操作 | 目的 |\n|--------|------|------|\n| **P0** | `systemctl --user disable ubuntu-insights-collect.service ubuntu-insights-upload.service` | 停止 CPU 飙高 |\n| **P1** | `docker system prune -a` + microk8s 旧镜像清理 | 释放磁盘 |\n| **P2** | 禁用后观察 24h，确认无新的异常进程 | 排除恶意软件 |\n\n要我直接帮你执行禁用 insights 服务吗？"
