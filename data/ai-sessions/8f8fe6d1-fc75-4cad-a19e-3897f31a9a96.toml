  content = "工作流已创建成功 ✅。以下是总结：\n\n---\n\n## 工作流：Docker Compose 安装 Nginx\n\n### 节点构成（3 个节点）\n\n| 顺序 | 节点 | 作用 |\n|------|------|------|\n| ① | `system_ready` | 工作流入口 |\n| ② | `docker_connect` | 通过 SSH 隧道连接远端 Docker daemon（192.168.112.128:22，root 用户） |\n| ③ | `docker_run` | 拉取 `nginx:latest` 镜像并启动容器 |\n\n### 关键配置\n\n- **镜像**：`nginx:latest`\n- **端口映射**：`80:80`\n- **容器名**：`nginx`\n- **重启策略**：`unless-stopped`（服务异常退出或 Docker 重启后自动恢复）\n\n### ⚠️ 需要说明\n\n1. **不是严格 docker compose**：当前节点目录中没有 `docker compose` 节点，因此用 `docker_connect` + `docker_run` 等效实现。对于单服务部署，最终效果一致。\n2. **运行时需输入 SSH 密码**：工作流包含一个 `SSH 密码` 变量，执行时需要填入 root 用户的密码。\n3. **端口冲突提醒**：当前服务器 80 端口已被占用，若需使用其他端口请在 `docker_run` 节点的 `ports` 字段中修改（如 `8080:80`）。\n\n如需调整端口或其他参数，随时告诉我。"
