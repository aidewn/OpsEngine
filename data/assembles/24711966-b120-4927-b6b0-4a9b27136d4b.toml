[[nodes]]
  id = "f915f84e-5d5a-4d85-a54c-87966e836709"
  type = "math_add"
  [nodes.config]
    a_default = ""
    b_default = "\n\n# 设置默认值\nREDIS_PORT=${REDIS_PORT:-6379}\nREDIS_IMAGE=${REDIS_IMAGE:-redis:latest}\nREDIS_PASSWORD=${REDIS_PASSWORD:-}\nDATA_VOLUME=${DATA_VOLUME:-}\n\ncat > $COMPOSE_DIR/docker-compose.yml <<'EOF'\nversion: '3.8'\nservices:\n  redis:\n    image: $REDIS_IMAGE\n    container_name: redis\n    ports:\n      - \"${REDIS_PORT}:6379\"\n    restart: unless-stopped\nEOF\nif [ -n \"$REDIS_PASSWORD\" ]; then\n  sed -i \"/image:/a\\    command: redis-server --requirepass ${REDIS_PASSWORD}\" $COMPOSE_DIR/docker-compose.yml\nfi\nif [ -n \"$DATA_VOLUME\" ]; then\n  sed -i \"/restart:/a\\    volumes:\n      - ${DATA_VOLUME}:/data\" $COMPOSE_DIR/docker-compose.yml\nfi\ncd $COMPOSE_DIR\nif command -v docker &> /dev/null && docker compose version &> /dev/null; then\n  docker compose up -d\nelif command -v docker-compose &> /dev/null; then\n  docker-compose up -d\nelse\n  echo \"Docker Compose not found\"\n  exit 1\nfi"
    var_type = "String"
  [nodes.position]
    x = 1683.68758345307
    y = 98.57932320821848

