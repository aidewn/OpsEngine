[[nodes]]
  id = "bb3e9a6b-e284-460b-9c94-847b17a3b68d"
  type = "text_template"
  [nodes.config]
    params = ["redis_port_var", "redis_image_var", "redis_password_var", "redis_data_volume_var"]
    template = "#!/bin/bash\nset -e\nCOMPOSE_DIR=/opt/redis\nmkdir -p $COMPOSE_DIR\n\nREDIS_PORT=\"{{ redis_port_var }}\"\nREDIS_IMAGE=\"{{ redis_image_var }}\"\nREDIS_PASSWORD=\"{{ redis_password_var }}\"\nDATA_VOLUME=\"{{ redis_data_volume_var }}\"\n\n# 设置默认值\nREDIS_PORT=${REDIS_PORT:-6379}\nREDIS_IMAGE=${REDIS_IMAGE:-redis:latest}\nREDIS_PASSWORD=${REDIS_PASSWORD:-}\nDATA_VOLUME=${DATA_VOLUME:-}\n\ncat > $COMPOSE_DIR/docker-compose.yml <<EOF\nservices:\n  redis:\n    image: \"${REDIS_IMAGE}\"\n    container_name: redis\n    ports:\n      - \"${REDIS_PORT}:6379\"\n    restart: unless-stopped\nEOF\n\nif [ -n \"$REDIS_PASSWORD\" ]; then\n  cat >> $COMPOSE_DIR/docker-compose.yml <<EOF\n    command: \"redis-server --requirepass ${REDIS_PASSWORD}\"\nEOF\nfi\n\nif [ -n \"$DATA_VOLUME\" ]; then\n  cat >> $COMPOSE_DIR/docker-compose.yml <<EOF\n    volumes:\n      - \"${DATA_VOLUME}:/data\"\nEOF\nfi\n\ncd $COMPOSE_DIR\nif command -v docker >/dev/null && docker compose version >/dev/null; then\n  docker compose up -d\nelif command -v docker-compose >/dev/null; then\n  docker-compose up -d\nelse\n  echo \"Docker Compose not found\"\n  exit 1\nfi"
  [nodes.position]
    x = 312.9585484358439
    y = 507.4566304092908

