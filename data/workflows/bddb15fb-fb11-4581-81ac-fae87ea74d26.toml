id = "bddb15fb-fb11-4581-81ac-fae87ea74d26"
name = "检查服务器CPU和内存"
description = "通过SSH连接远程服务器，执行命令查看CPU和内存使用情况"
variables = []

[[nodes]]
  id = "7ca86477-ed98-457e-9643-8e1e3931247d"
  type = "system_ready"
  [nodes.config]
  [nodes.position]
    x = 80.0
    y = 120.0

[[nodes]]
  id = "b3ab27a5-bdf4-4d9c-ade6-b726b226e2d1"
  type = "env_connect_ssh"
  [nodes.config]
    config_id = "e7746006-95d7-4ef6-b71d-34404e96c2df"
    environment_id = "e7a08c58-f045-40ff-9b9b-c9415212b8dd"
  [nodes.position]
    x = 250.0
    y = 120.0

[[nodes]]
  id = "4a107804-1e1b-43b8-89f7-cd1ee7f52288"
  type = "linux_exec_command"
  [nodes.config]
    command = "echo '=== CPU Info ===' && lscpu && echo '=== Memory Info ===' && free -h"
    fail_on_error = false
    timeout_seconds = 30.0
  [nodes.position]
    x = 440.5868341981218
    y = 106.96167167452282

[[nodes]]
  id = "5e30cef3-e440-47bd-82c8-62078dbeda06"
