id = "45e7ad5e-51aa-4629-b78c-ae9feffc32d3"
name = "部署 Nginx"
description = "通过环境 SSH 直连服务器，用 shell 脚本拉取 nginx 镜像并启动容器，映射 80 端口"
variables = []

[[nodes]]
  id = "aac4673c-8680-4791-a518-4619b26a1025"
  type = "system_ready"
  [nodes.config]
  [nodes.position]
    x = 100.0
    y = 200.0

[[nodes]]
  id = "63512c17-1cbd-4c53-8100-4cde4911c4be"
  type = "env_connect_ssh"
  [nodes.config]
    config_id = "cc951b78-46bc-4777-ac8f-41b7f560bec9"
    environment_id = "1638a7ba-e778-4267-b296-1afba582fea6"
  [nodes.position]
    x = 300.0
    y = 200.0

[[nodes]]
  id = "fd6bf890-2b83-4083-a8b6-826c404bb4e5"
  type = "linux_exec_script"
  [nodes.config]
    default_script = "docker pull nginx:latest"
    fail_on_error = true
    interpreter = "bash"
    timeout_seconds = 300.0
  [nodes.position]
    x = 500.0
    y = 200.0

[[nodes]]
  id = "87899d55-c04d-4f16-a8c5-96c94b9ac21c"
  type = "linux_exec_script"
  [nodes.config]
    default_script = "docker run -d --name nginx --restart unless-stopped -p 80:80 nginx:latest"
    fail_on_error = true
    interpreter = "bash"
    timeout_seconds = 60.0
  [nodes.position]
    x = 700.0
    y = 200.0

[[nodes]]
  id = "edf04d02-279d-4f07-af34-cec56e40d154"
  type = "system_over"
  [nodes.config]
  [nodes.position]
    x = 900.0
    y = 200.0

[[nodes]]
  id = "6432b5c7-2a19-40b4-b922-33647fafc7e0"
  type = "system_update"
  [nodes.config]
    delta_seconds = 60.0
    delta_type = "interval"
  [nodes.position]
    x = 80.0
    y = 280.0

