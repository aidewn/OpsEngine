content = "# CPU 诊断报告\n\n- 监控项：CPU\n- 严重级别：critical\n- 异常开始：2026-06-14T11:56:07+08:00\n\n## 异常触发证据\n\n- host.basic 采集失败: SSH 连接失败: ssh: handshake failed: EOF\n- host.basic 采集失败: SSH 连接失败: ssh: handshake failed: EOF\n\n## 当前采集数据\n\n### host.basic（target: cc951b78-46bc-4777-ac8f-41b7f560bec9）\n\n采集失败：目标配置未找到: cc951b78-46bc-4777-ac8f-41b7f560bec9\n\n## 诊断结论\n\n### 1) 最可能的根因\n监控项 CPU 异常的根因是 `host.basic` 采集插件无法正常工作：  \n- 先前的采集错误为 SSH 握手失败（EOF），表明 Agent 无法通过 SSH 连接到目标主机；  \n- 当前采集错误为“目标配置未找到”（ID: `cc951b78-46bc-4777-ac8f-41b7f560bec9`），表明该主机的连接配置在采集系统中已丢失或不可用。\n\n最可能的原因是目标主机的记录/配置被删除或损坏，导致 SSH 连接信息缺失，进而引起 SSH 握手失败，最终使 CPU 指标采集中断。\n\n### 2) 置信度\n**中**\n\n原因：虽然两条证据链都指向主机连接或配置问题，但没有直接证据排除网络故障、SSH 服务宕机等可能性。需进一步排查。\n\n### 3) 排查与修复建议\n- **检查主机配置有效性**：在监控系统中确认 UUID `cc951b78-46bc-4777-ac8f-41b7f560bec9` 对应的主机是否存在、是否被误删除或停用；如已删除，需重新添加或恢复。\n- **验证 SSH 连通性与服务**：手动从采集节点 ping 目标主机 IP，使用 `ssh -v` 测试 SSH 握手；检查目标主机 SSH 服务是否正常运行、防火墙是否屏蔽采集端 IP。\n- **检查采集器配置文件**：查看 `host.basic` 采集插件的配置是否引用有效的主机条目，是否有定时同步导致配置被清理。\n- **查看采集器日志**：获取采集器运行日志，确认“handshake EOF”错误发生时的具体阶段（TCP 连接建立后是否为 EOF），以区分网络复位、SSH 协议不匹配等问题。\n- **恢复监控**：如配置已恢复，重新触发采集任务并确认 CPU 指标能正常上报；若主机已永久下线，需解除监控告警规则。\n\n**需要补充的数据**：  \n- 目标主机的当前状态（是否在线、SSH 服务日志）；  \n- 采集系统近期的配置变更记录；  \n- 采集节点到目标主机的网络连通性测试结果（ping/telnet 22）；  \n- 采集插件完整错误日志，以便判断 EOF 出现前是否到达 SSH 协议协商阶段。\n\n### 4) 风险提示\n- 在此期间，该主机的 CPU 高负载、宕机等真实风险无法被感知，可能导致服务中断遗漏。\n- 如主机仍在线但监控缺失，运维将失去对该节点的性能可视化与报警能力。\n- 若根因为配置批量删除，需排查是否存在其他受影响的监控目标，防止大面积监控盲区。\n"
