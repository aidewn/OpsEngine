content = "# CPU 诊断报告\n\n- 监控项：CPU\n- 严重级别：critical\n- 异常开始：2026-06-14T11:50:07+08:00\n\n## 异常触发证据\n\n- host.basic 采集失败: SSH 连接失败: ssh: handshake failed: EOF\n- host.basic 采集失败: SSH 连接失败: ssh: handshake failed: EOF\n\n## 当前采集数据\n\n### host.basic（target: cc951b78-46bc-4777-ac8f-41b7f560bec9）\n\n采集失败：SSH 连接失败: ssh: handshake failed: EOF\n\n## 诊断结论\n\n### 最可能的根因\n目标主机的 SSH 服务（sshd）未正常运行，或网络层/防火墙规则阻止了监控节点的 SSH 连接，导致握手阶段直接中断（EOF）。\n\n### 置信度\n**中**（缺少目标主机侧的状态信息，如 SSH 服务状态、网络连通性、系统负载等）\n\n### 排查与修复建议\n1. **验证目标主机可达性**：从监控节点执行 `ping <目标IP>` 检查网络连通性；若不通，排查网络设备、路由、安全组或防火墙规则。\n2. **检查 SSH 服务状态**：通过带外方式（控制台/IPMI）登录目标主机，执行 `systemctl status sshd`（或 `service ssh status`），确认 SSH 服务是否运行；若未运行，查看日志并启动服务。\n3. **检查防火墙/安全组设置**：确认目标主机防火墙（iptables/firewalld）或云安全组允许监控节点 IP 访问 22（或自定义 SSH 端口），规则应允许入站 TCP 连接。\n4. **验证 SSH 配置与密钥**：确认 `/etc/ssh/sshd_config` 中没有禁止监控节点 IP 或限制密钥交换算法，检查是否有 `AllowUsers`/`DenyUsers` 等限制；尝试手动 `ssh -v user@host` 以获取详细错误信息。\n5. **检查主机资源**：若主机 CPU/内存/连接数满载，可能导致 sshd 无法响应新连接。通过带外查看负载与进程。\n\n### 风险提示\n- 监控项 `host.basic` 采集失败会导致 CPU、内存、磁盘等基础指标中断，形成**监控盲区**，当主机出现性能或故障问题时无法及时告警。\n- 若该主机承载关键业务，持续断开可能意味着主机已宕机或处于不可响应状态，需立即介入排查。\n\n> **需要补充的数据**：目标主机系统日志（/var/log/secure）、SSH 服务状态、网络连通性测试结果、防火墙规则、主机当前资源使用情况（需通过带外方式获取），以便精确定位根因。\n"
