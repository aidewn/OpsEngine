content = "# CPU 诊断报告\n\n- 监控项：CPU\n- 严重级别：critical\n- 异常开始：2026-06-14T11:50:07+08:00\n\n## 异常触发证据\n\n- host.basic 采集失败: SSH 连接失败: ssh: handshake failed: EOF\n- host.basic 采集失败: SSH 连接失败: ssh: handshake failed: EOF\n\n## 当前采集数据\n\n### host.basic（target: cc951b78-46bc-4777-ac8f-41b7f560bec9）\n\n采集失败：SSH 连接失败: ssh: handshake failed: EOF\n\n## 诊断结论\n\n### 1) 最可能的根因\n监控目标主机无法通过 SSH 连接，导致 host.basic 采集失败，因此无法获取 CPU 指标。触发证据中的 `ssh: handshake failed: EOF` 提示在 SSH 握手阶段连接被远端关闭或中断，可能原因包括：\n- 目标主机负载过高（如 CPU 已占满）导致 SSH 服务无法正常握手；\n- 目标主机 SSH 服务崩溃、未启动或端口被防火墙/安全组屏蔽；\n- 网络链路中断、丢包严重或目标主机已宕机。\n\n### 2) 置信度\n**中**  \n当前仅有 SSH 连接失败证据，缺少目标主机的 CPU 实时使用率、负载、网络连通性、进程状态等直接数据，无法确认是主机资源耗尽还是服务/网络层故障。\n\n### 3) 排查与修复建议\n- **检查主机存活状态**：通过带外管理（如 IPMI、云控制台 VNC）或 ping 判断目标主机是否在线，若 ping 不通则排查网络/电源/操作系统层面故障。\n- **验证 SSH 服务**：若主机在线，登录控制台（或通过其他管理通道）检查 sshd 进程是否运行、监听端口是否正确、系统防火墙或云安全组是否放行 SSH 端口。\n- **分析系统资源**：若能通过控制台登录，立即执行 `top`/`htop`、`dmesg`、`journalctl -u sshd` 等命令，确认 CPU 使用率、负载、内存及 OOM 情况，查看 SSH 服务日志是否有异常断连记录。\n- **尝试恢复采集**：在确认目标主机正常后，从监控节点手动 SSH 测试，排除监控节点自身网络/认证问题（如密钥变更、known_hosts 冲突等），确保配置正确。\n- **临时绕过**：若急需判断 CPU 状态，可启用备选采集方式（如 SNMP、Agent 推送等），但需提前具备这些通道。\n\n### 4) 风险提示\n- 若根因是目标 CPU 耗尽或负载过高，可能导致其上运行的业务服务响应缓慢或不可用，需立即介入。\n- 无法采集意味着监控盲区，其他关联告警可能被遗漏，需尽快恢复可观测性。\n- 若 SSH 失败由安全事件（如入侵后篡改、暴力破解防御锁定）引起，存在进一步扩散风险，需核查安全日志。\n\n**需补充数据**：\n- 目标主机 ping 可达性、SSH 端口网络连通性（tcping）、带外系统日志；\n- 主机当前 CPU 使用率、负载均线、进程列表；\n- SSH 服务状态、日志和配置变更记录；\n- 监控节点到目标主机的网络路径健康度。\n"
